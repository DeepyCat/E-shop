<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>HSOS6 | ZZZ Plush Store</title>
<link rel="stylesheet" href="css/HSOS6.css">
</head>

<body>

<header>
  <img src="img/logo.png" class="logo">
  <nav>
    <a href="index.html">Domů</a>
    <a href="categories.html">Kategorie</a>
    <a href="about.html">O nás</a>
   
  </nav>
</header>

<section class="banner">
  <h2>HSOS6</h2>
  <p>
   idk něco tam napíšu
  </p>
</section>

<section class="grid">
  <div class="card" onclick="openModal('miyabi')">
    <img src="img/miyabi.png">
    <h3>Hoshimi Miyabi</h3>
    <div class="price">999 Kč</div>
  </div>

  <div class="card" onclick="openModal('yanagi')">
    <img src="img/yanagi.png">
    <h3>Tsukishiro Yanagi</h3>
    <div class="price">459 Kč</div>
  </div>

  <div class="card" onclick="openModal('soukaku')">
    <img src="img/soukaku.png">
    <h3>Soukaku</h3>
    <div class="price">529 Kč</div>
  </div>
</section>


<div class="modal" id="modal">
  <div class="modal-content">
    <img id="modal-img">
    <h3 id="modal-title"></h3>
    <p id="modal-desc"></p>
    <div class="price" id="modal-price"></div>
    <button>Přidat do košíku</button>
    <span class="close" onclick="closeModal()">Zavřít</span>
  </div>
</div>

<script>
const data = {
  miyabi: {
    img: "img/miyabi.png",
    title: "Hoshimi Miyabi Plyšák",
    price: "999 Kč",
    desc: "Anby je tichá, disciplinovaná bojovnice a hlavní úderná síla Cunning Hares. Navzdory chladnému vystupování má silný smysl pro zodpovědnost a týmovou loajalitu."
  },
  yanagi: {
    img: "img/yanagi.png",
    title: "Tsukishiro Yanagi Plyšák",
    price: "459 Kč",
    desc: "Billy je android s bezstarostnou povahou a láskou k chaosu. I když působí lehkovážně, v boji je extrémně spolehlivý a nebezpečný protivník."
  },
  soukaku: {
    img: "img/soukaku.png",
    title: "Soukaku Plyšák",
    price: "529 Kč",
    desc: "Nicole je charismatická vůdkyně Cunning Hares. Je mistryní manipulace, vyjednávání a přežití v tvrdém světě New Eridu."
  }
};

function openModal(key) {
  document.getElementById("modal-img").src = data[key].img;
  document.getElementById("modal-title").innerText = data[key].title;
  document.getElementById("modal-desc").innerText = data[key].desc;
  document.getElementById("modal-price").innerText = data[key].price;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
